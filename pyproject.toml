[build-system]
requires = ["setuptools"]
build-backend = 'setuptools.build_meta'

[tool.setuptools.packages.find]
include = ["thor*"]

[project]
name = "thor"
version = "1.0.2"
description = "THOR - Transformer based foundation model for Heterogeneous Observation and Resolution."
license = { "text" = "MIT License" }
readme = "README.md"
authors = [{ name = "Theodor Forgaard", email = "tforgaard@nr.no" }]
requires-python = ">=3.10"
keywords = [
    "pretraining",
    "geospatial foundation models",
    "artificial intelligence",
    "earth observation",
    "remote sensing",
    "sentinel",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "torch>=2.2.2",
    "torchvision>=0.17.2",
    "pytorch-lightning>=2.2.0.post0",
    "timm>=0.9.2, <=1.0.15",
    "xarray>=2024.2.0",
    "rioxarray>=0.15.0",
    "h5netcdf>=1.3.0",
    "rasterio>=1.3.10",
    "geojson>=3.1.0",
    "geopandas>=0.14.4",
    "pandas>=1.5.3",
    "numpy>=1.26.4",
    "matplotlib>=3.8.3",
    "einops>=0.8.2",
]

[project.urls]
Repository = "https://github.com/FM4CS/THOR"
Documentation = "https://github.com/FM4CS/THOR"


[project.optional-dependencies]

scripts = ["huggingface-hub>=0.25.0", "wandb>=0.16.4", "fire>=0.6.0"]

all = ["thor[scripts]"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipython>=8.27.0",
    "pytest>=9.0.2",
    "ruff>=0.8.1",
]


[[tool.mypy.overrides]]
module = "timm"
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "B",
    "C",
    "DTZ",
    "E",
    "EM",
    "F",
    "FBT",
    "I",
    "ICN",
    "ISC",
    "N",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "Q",
    "RUF",
    "S",
    "T",
    "TID",
    "UP",
    "W",
    "YTT",
]
ignore = [
    # Allow non-abstract empty methods in abstract base classes
    "B027",
    # Allow boolean positional values in function calls, like `dict.get(... True)`
    "FBT003",
    # Ignore checks for possible passwords
    "S105",
    "S106",
    "S107",
    # Ignore complexity
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    # Upper case
    "N806",
    # print statements allowed
    "T201",
]
unfixable = [
    # Don't touch unused imports
    "F401",
]

[tool.ruff.lint.isort]
known-first-party = ["thor"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
